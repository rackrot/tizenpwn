[project]
name = "tizenpwn"
version = "0.1.0"
description = "Owner-authorized Samsung TU7000 T-KTSU2AKUC-2743.0 Remote PC/CIFS route"
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
tizenpwn = "tizenpwn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff==0.16.3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tizenpwn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
